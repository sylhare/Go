# The five backing services: same Go binaries as the compose stack, one
# Deployment + Service each. Images are built locally and loaded into kind, so
# imagePullPolicy is IfNotPresent.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-a
spec:
  replicas: 1
  selector: { matchLabels: { app: echo-a } }
  template:
    metadata: { labels: { app: echo-a } }
    spec:
      containers:
        - name: echo
          image: traefik-demo/echo:v1
          imagePullPolicy: IfNotPresent
          env: [{ name: NAME, value: app-a }]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: echo-a }
spec:
  selector: { app: echo-a }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-b
spec:
  replicas: 1
  selector: { matchLabels: { app: echo-b } }
  template:
    metadata: { labels: { app: echo-b } }
    spec:
      containers:
        - name: echo
          image: traefik-demo/echo:v1
          imagePullPolicy: IfNotPresent
          env: [{ name: NAME, value: admin-b }]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: echo-b }
spec:
  selector: { app: echo-b }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authgw
spec:
  replicas: 1
  selector: { matchLabels: { app: authgw } }
  template:
    metadata: { labels: { app: authgw } }
    spec:
      containers:
        - name: authgw
          image: traefik-demo/authgw:v1
          imagePullPolicy: IfNotPresent
          env:
            - { name: AUTHORIZE_URL, value: "http://id.localhost/authorize" }
            - { name: TOKEN_URL, value: "http://idp.default.svc:9000/token" }
            - { name: USERINFO_URL, value: "http://idp.default.svc:9000/userinfo" }
            - { name: CALLBACK_URL, value: "http://auth.localhost/callback" }
            - { name: COOKIE_DOMAIN, value: "localhost" }
          ports: [{ containerPort: 8081 }]
---
apiVersion: v1
kind: Service
metadata: { name: authgw }
spec:
  selector: { app: authgw }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp
spec:
  replicas: 1
  selector: { matchLabels: { app: idp } }
  template:
    metadata: { labels: { app: idp } }
    spec:
      containers:
        - name: idp
          image: traefik-demo/idp:v1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 9000 }]
---
apiVersion: v1
kind: Service
metadata: { name: idp }
spec:
  selector: { app: idp }
  ports: [{ port: 9000, targetPort: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: errors
spec:
  replicas: 1
  selector: { matchLabels: { app: errors } }
  template:
    metadata: { labels: { app: errors } }
    spec:
      containers:
        - name: errors
          image: traefik-demo/errors:v1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
---
apiVersion: v1
kind: Service
metadata: { name: errors }
spec:
  selector: { app: errors }
  ports: [{ port: 8082, targetPort: 8082 }]
